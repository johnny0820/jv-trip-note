<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Johnny/Vivian">
  <meta name="theme-color" content="#fbf7f0">
  <title>Johnny &amp; Vivian｜旅遊筆記</title>
  
<style>
	  :root{
	  --paper:#fbf7f0; --paper2:#f6f0e6; --ink:#2b2b2b; --muted:#6b6b6b;
	  --lavender:#7c6ee6; --lavender2:#a89cf2;
	  --line:#e6e0f2; --grid:rgba(124,110,230,.10);
	  --cardShadow: 0 6px 18px rgba(40,40,60,.06);
	  --tap: 44px;
	}

	/* ===== Base ===== */
	*{ box-sizing:border-box; }
	html, body{ height:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; }

	body{
	  margin:0;
	  font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
	  color: var(--ink);
	  background:
	    linear-gradient(var(--grid) 1px, transparent 1px),
	    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
	    var(--paper); /* 純色 */
	  background-size: 24px 24px, 24px 24px, auto;
	}

	a{ color:inherit; }
	.app, .sidebar, .main, .grid, .card{ min-width:0; }

	.app{
	  display:grid;
	  grid-template-columns: 320px minmax(0, 1fr);
	  min-height:100vh;
	}

	/* ===== Sidebar ===== */
	.sidebar{
	  border-right: 1px solid var(--line);
	  padding: 14px;
	  background: rgba(255,255,255,.35);
	  overflow: visible;
	}
	.topDock{ overflow: visible; }

	.sideHero{
	  position: relative;
	  border: 1px solid var(--line);
	  border-radius: 0;
	  overflow: hidden;
	  background: linear-gradient(135deg, rgba(124,110,230,.18), rgba(220,236,255,.55));
	  background-size: cover;
	  background-position: center;
	  padding: 12px;
	  min-height: 120px;
	}
	.sideHeroOverlay{
	  position:absolute; inset:0;
	  background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.26));
	  pointer-events:none;
	}
	.sideTop{ position:relative; z-index:1; }

	.title{
	  font-size:20px; font-weight:900; letter-spacing:.2px;
	  display:flex; align-items:center; justify-content:space-between; gap:12px;
	  padding: 8px 10px;
	  border-radius: 14px;
	  background: rgba(255,255,255,.55);
	  border: 1px solid rgba(255,255,255,.45);
	  backdrop-filter: blur(8px);
	  -webkit-backdrop-filter: blur(8px);
	}
	.badge{
	  font-size:12px; color:var(--muted);
	  border:1px solid rgba(255,255,255,.55);
	  padding:4px 10px;
	  border-radius:999px;
	  white-space:nowrap;
	  background: rgba(255,255,255,.85);
	  backdrop-filter: blur(6px);
	  -webkit-backdrop-filter: blur(6px);
	}

	.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

	/* ===== Controls ===== */
	.btn{
	  appearance:none;
	  border:1px solid rgba(255,255,255,.80);
	  background: rgba(255,255,255,.92);
	  color: var(--ink);
	  padding:9px 10px;
	  border-radius:12px;
	  cursor:pointer;
	  font-weight:900;
	  font-size:13px;
	  box-shadow: 0 6px 18px rgba(0,0,0,.10);
	  backdrop-filter: blur(6px);
	  -webkit-backdrop-filter: blur(6px);
	  touch-action: manipulation;
	}
	.btn:hover{ border-color: rgba(124,110,230,.35); background: rgba(255,255,255,.96); }

	.btn.primary{
	  border-color: rgba(124,110,230,.55);
	  background: rgba(124,110,230,.26);
	}
	.btn.primary:hover{ background: rgba(124,110,230,.32); }

	.btn.bad{
	  border-color: rgba(212,106,122,.55);
	  background: rgba(212,106,122,.14);
	  box-shadow: 0 2px 10px rgba(40,40,60,.05);
	  backdrop-filter: none;
	  -webkit-backdrop-filter: none;
	}

	.input, textarea{
	  width:100%;
	  border:1px solid rgba(255,255,255,.75);
	  background: rgba(255,255,255,.92);
	  color: var(--ink);
	  border-radius:12px;
	  padding:10px 12px;
	  font-size:13px;
	  box-shadow: 0 1px 0 rgba(124,110,230,.08) inset;
	  backdrop-filter: blur(6px);
	  -webkit-backdrop-filter: blur(6px);
	}
	textarea{
	  min-height: 120px;
	  resize: vertical;
	  line-height:1.6;
	  backdrop-filter: none;
	  -webkit-backdrop-filter: none;
	  border:1px solid var(--line);
	  background: rgba(255,255,255,.75);
	}

	/* ===== Day dock + list ===== */
	.dayDockSpacer{ display:none; height:0; }
	.dayDock{ position: relative; overflow: visible; }

	.dayList{
	  margin-top: 10px;
	  display:flex;
	  flex-direction: row;
	  gap: 10px;
	  flex-wrap: nowrap;
	  overflow-x: auto;
	  overflow-y: hidden;
	  padding-bottom: 8px;
	  padding-right: 64px;           /* 給右下角的記帳 FAB 留空 */
	  width: 100%;
	  max-width: 100%;
	  scroll-snap-type: x mandatory;
	  -webkit-overflow-scrolling: touch;
	  overscroll-behavior-x: contain;
	  
	}
	.dayList::-webkit-scrollbar{ height: 10px; }
	.dayList::-webkit-scrollbar-thumb{ background: rgba(124,110,230,.25); border-radius: 999px; }
	.dayList::-webkit-scrollbar-track{ background: rgba(255,255,255,.20); }

	.dayItem{
	  border:1px solid var(--line);
	  border-radius:12px;
	  padding:10px;
	  cursor:pointer;
	  background: rgba(255,255,255,.78);
	  box-shadow: 0 2px 10px rgba(40,40,60,.05);
	  flex: 0 0 auto;
	  width: clamp(170px, 40vw, 240px);
	  scroll-snap-align: start;

	  display:flex;
	  flex-wrap: wrap;
	  align-items: flex-start;
	  gap: 6px 10px;
	}
	.dayItem:hover{ border-color: rgba(124,110,230,.45); background: rgba(168,156,242,.18); }
	.dayItem.active{ border-color: rgba(124,110,230,.70); background: rgba(124,110,230,.16); }

	.dayTopRow{
	  width: 100%;
	  display:flex;
	  align-items:flex-start;
	  justify-content: space-between;
	  gap: 10px;
	  min-width: 0;
	}
	.dayItem .dayTopRow .pill{ margin-top:-2px; margin-right:-2px; }

	.dayName{
	  font-weight: 900;
	  min-width: 0;
	  overflow:hidden;
	  text-overflow: ellipsis;
	  white-space: nowrap;
	}
	.dayThemeLine{
	  width: 100%;
	  font-size: 12px;
	  color:var(--muted);
	  display:-webkit-box;
	  -webkit-line-clamp: 2;
	  -webkit-box-orient: vertical;
	  overflow:hidden;
	}
	.dayThemeLine:empty{ display:none; }

	.pill{
	  font-size:11px; color:var(--muted);
	  border:1px solid var(--line);
	  padding:2px 5px;
	  border-radius:999px;
	  white-space:nowrap;
	  background: rgba(255,255,255,.75);
	  flex: 0 0 auto;
	}
	.dayItem.addDay{
	  justify-content:center;
	  align-items:center;
	  border-style: dashed;
	  background: rgba(120,120,120,.12);
	  color: rgba(43,43,43,.85);
	  font-weight: 900;
	  font-size: 18px;
	  letter-spacing: .5px;
	}

	/* 日期 pill 可點 */
	#dayPill, .dayItem .pill{ cursor:pointer; user-select:none; }
	.dayPillWrap{ position: relative; display:inline-flex; align-items:center; }
	.dayDateOverlay{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }

	/* dayDock 右下角記帳 FAB */
	.dayDockFab{
	  position: absolute;
	  left: 12px;
	  right: auto;
	  bottom: -28px;
	  z-index: 300;
	}
	.dayDockFabBtn{
	  width: 56px;
	  height: 56px;
	  border-radius: 999px;
	  border: 1px solid rgba(255,255,255,.65);
	  background: rgba(255,255,255,.92);
	  backdrop-filter: blur(10px);
	  -webkit-backdrop-filter: blur(10px);
	  box-shadow: 0 14px 32px rgba(0,0,0,.18);
	  cursor: pointer;
	  font-size: 40px;
	  font-weight: 900;
	  display:flex;
	  align-items:center;
	  justify-content:center;
	}

	/* ===== Main layout ===== */
	.main{ padding:18px; }
	.grid{
	  display:grid;
	  grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr);
	  gap:14px;
	}

	.card{
	  border:1px solid var(--line);
	  border-radius:14px;
	  background: rgba(255,255,255,.72);
	  box-shadow: var(--cardShadow);
	  padding:14px;
	}
	.card h2{
	  margin:0 0 10px 0;
	  font-size:14px;
	  letter-spacing:.2px;
	  display:flex;
	  align-items:center;
	  justify-content:space-between;
	  gap:10px;
	}
	.card h3{
	  margin:14px 0 8px 0;
	  font-size:13px;
	  color: var(--ink);
	  opacity:.85;
	}

	.titleTag{
	  background: rgba(255,255,255,.92);
	  border: 1px solid var(--line);
	  padding: 4px 10px;
	  border-radius: 999px;
	  display: inline-block;
	}

	/* ===== meta panel ===== */
	details.metaPanel{
	  border: 1px solid var(--line);
	  border-radius: 14px;
	  background: rgba(255,255,255,.70);
	  padding: 10px;
	}
	details.metaPanel > summary{
	  list-style: none;
	  cursor: pointer;
	  font-weight: 900;
	  display:flex;
	  align-items:center;
	  justify-content:space-between;
	  gap: 10px;
	  padding: 4px 2px;
	}
	details.metaPanel > summary::-webkit-details-marker{ display:none; }
	.metaSummaryRight{
	  font-size:12px;
	  color: var(--muted);
	  font-weight: 900;
	  white-space: nowrap;
	}

	.kvs{
	  display:grid;
	  grid-template-columns: 120px 1fr;
	  gap:8px 10px;
	  align-items:center;
	}
	.k{ color:var(--muted); font-size:12px; }

	/* ===== stay photo ===== */
	.stayWrap{
	  display:grid;
	  grid-template-columns: 1fr 140px;
	  gap: 10px;
	  align-items:start;
	}
	.stayPhoto{
	  border: 1px solid var(--line);
	  border-radius: 12px;
	  overflow:hidden;
	  background: rgba(255,255,255,.70);
	  height: 92px;
	  position: relative;
	  cursor: pointer;
	}
	.stayPhoto img{ width:100%; height:100%; object-fit: cover; display:block; }
	.stayPhotoPlaceholder{
	  width:100%; height:100%;
	  display:flex;
	  align-items:center;
	  justify-content:center;
	  font-size:12px;
	  color: var(--muted);
	  background: rgba(124,110,230,.08);
	  padding: 8px;
	  text-align:center;
	}
	.stayPhotoTools{
	  position:absolute;
	  right: 8px;
	  bottom: 8px;
	  display:flex;
	  gap: 8px;
	}
	.miniBtn{
	  border: 1px solid rgba(255,255,255,.7);
	  background: rgba(255,255,255,.92);
	  border-radius: 10px;
	  padding: 6px 8px;
	  font-size: 12px;
	  font-weight: 900;
	  cursor:pointer;
	}

	/* ===== spots ===== */
	.spotList{ display:flex; flex-direction: column; gap: 10px; }
	.spotRow{
	  border: 1px solid var(--line);
	  border-radius: 14px;
	  background: rgba(255,255,255,.78);
	  box-shadow: 0 2px 10px rgba(40,40,60,.05);
	  padding: 10px;
	  display:flex;
	  gap: 10px;
	  align-items:center;
	  cursor:pointer;
	  touch-action: pan-y;
  	transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease;
	}
	.spotRow{ touch-action: pan-y; } /* 讓上下滑順 */
	.spotHandle{
	  width: 34px;
	  height: 34px;
	  flex: 0 0 auto;
	  display: grid;
	  place-items: center;
	  border: 1px solid var(--line);
	  border-radius: 12px;
	  background: rgba(255,255,255,.75);
	  color: var(--muted);
	  font-weight: 900;
	  cursor: grab;
	  user-select: none;
	}
	.spotHandle:active{ cursor: grabbing; }
	.spotThumb{
	  width: 72px;
	  height: 54px;
	  border-radius: 12px;
	  border: 1px solid var(--line);
	  overflow:hidden;
	  background: rgba(124,110,230,.08);
	  flex: 0 0 auto;
	}
	.spotThumb img{ width:100%; height:100%; object-fit: cover; display:block; }
	.spotThumbPh{
	  width:100%; height:100%;
	  display:flex; align-items:center; justify-content:center;
	  font-size:11px; color: var(--muted);
	  padding: 6px;
	  text-align:center;
	}
	.spotInfo{
	  flex: 1;
	  min-width: 0;
	  display:flex;
	  flex-direction: column;
	  gap: 2px;
	}
	.spotTitleLine{ font-weight: 900; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
	.spotSubLine{ font-size: 12px; color: var(--muted); overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }

	.btn.sm{
	  padding: 7px 9px;
	  border-radius: 10px;
	  font-size: 12px;
	  box-shadow: none;
	  backdrop-filter: none;
	  -webkit-backdrop-filter: none;
	}
	
	.spotList.isDragging .spotRow{
	  background: rgba(124,110,230,.10);
	  border-color: rgba(124,110,230,.35);
	}
	.spotList.isDragging .spotRow .swipeContent{
	  transition: none !important; /* 只關掉左滑刪除那個 translateX 的動畫 */
	}
	.spotAddRow{
	  border: 2px dashed rgba(120,120,120,.28);
	  border-radius: 14px;
	  background: rgba(120,120,120,.10);
	  padding: 12px;
	  display:flex;
	  align-items:center;
	  justify-content:center;
	  font-weight: 900;
	  cursor:pointer;
	  color: rgba(43,43,43,.85);
	  user-select: none;
	}

	/* ===== todos ===== */
	.todoTabs{
	  display:flex;
	  gap: 8px;
	  flex-wrap: wrap;
	  margin: 8px 0 10px 0;
	}
	.todoTab{
	  border: 1px solid var(--line);
	  background: rgba(255,255,255,.75);
	  border-radius: 999px;
	  padding: 6px 10px;
	  font-size: 12px;
	  font-weight: 900;
	  cursor: pointer;
	  user-select: none;
	  line-height: 1;
	}
	.todoTab.active{
	  border-color: rgba(124,110,230,.65);
	  background: rgba(124,110,230,.16);
	}
	.todoTab.add{
	  border-style: dashed;
	  background: rgba(120,120,120,.10);
	}
	.todoTabCount{
	  margin-left: 6px;
	  padding: 2px 6px;
	  border-radius: 999px;
	  border: 1px solid rgba(0,0,0,.06);
	  background: rgba(255,255,255,.70);
	  font-size: 11px;
	  color: var(--muted);
	}

	.checklist{ display:flex; flex-direction:column; gap:8px; }
	.checkItem{
	  display:flex;
	  gap:8px;
	  align-items:center;
	  border:1px solid var(--line);
	  border-radius:12px;
	  padding:8px 10px;
	  background: rgba(255,255,255,.78);
	}
	.checkItem input[type="checkbox"]{ width: 18px; height: 18px; flex: 0 0 auto; }
	.checkItem input[type="text"]{
	  border:none; outline:none; background:transparent; color:var(--ink);
	  width:100%;
	  font-size:16px;
	  font-weight: 900;
	}
	.checkItem input[type="checkbox"]:checked + input[type="text"]{
	  text-decoration: line-through;
	  opacity: .55;
	}

	/* Todo 左滑刪除 */
	.checkItem.todoRow{
	  touch-action: pan-y;
	  transition: transform .12s ease;
	}
	.todoDelBtn{
	  width: 32px; height: 32px;
	  padding: 0;
	  border-radius: 10px;
	  display:flex; align-items:center; justify-content:center;
	  font-size: 14px;
	  font-weight: 900;
	  box-shadow: none;
	  backdrop-filter: none;
	  -webkit-backdrop-filter: none;
	}

	/* ===== expenses ===== */

	table{ width:100%; border-collapse:collapse; font-size:14px; }
	th, td{
	  border-bottom:1px solid var(--line);
	  padding:8px 6px;
	  text-align:left;
	  vertical-align: top;
	}
	th{ color: var(--ink); font-weight:900; font-size:12px; letter-spacing:.2px; }
	.right{ text-align:right; }
	.sum{ font-weight:900; }

	/* 分類統計（點 pill 篩選） */
	.expenseTopBar{ display:flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
	.sumRow{ display:flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-weight: 900; }
	.sumBox{
	  border: 1px solid var(--line);
	  background: rgba(255,255,255,.65);
	  border-radius: 12px;
	  padding: 6px 10px;
	  white-space: nowrap;
	  cursor: pointer;
	  user-select: none;
	}
	.sumBox.active{
	  border-color: rgba(124,110,230,.65);
	  background: rgba(124,110,230,.16);
	}
	.sumBox.add{
	  border-style: dashed;
	  background: rgba(120,120,120,.10);
	}
	
	.sumMini{
	  font-size: 11px;
	  color: var(--muted);
	  font-weight: 900;
	  margin-left: 6px;
	  white-space: nowrap;
	}
	
	/* ✅ Expense sum pill：數字/幣別顏色分離 */
	.sumBox .sumAmt{
	  color: #111;   /* 你想更明顯可用 #7c6ee6；想低調可改成 rgba(...) */
	}

	.sumBox .sumCcy{
	  color: var(--muted);      /* 幣別跟 ALL 同色 */
	  margin-left: 4px;
	}

	/* =========================
	   Expense table（桌機＋手機共用）
	   ========================= */
	#expenseCard table,
	#expenseDetails table{
	  width: 100%;
	  table-layout: fixed;     /* ✅ 固定欄寬：避免跑版 */
	  border-collapse: collapse;
	  font-size: 12px;         /* ✅ 更緊湊 */
	}

	/* ✅ 只影響花費表格：縮小上下左右 padding */
	#expenseCard th, #expenseCard td,
	#expenseDetails th, #expenseDetails td{
	  padding: 1px 2px;
	  vertical-align: middle;
	}

	/* 分類欄（emoji） */
	#expenseCard th.expColCat, #expenseCard td.expColCat,
	#expenseDetails th.expColCat, #expenseDetails td.expColCat{
	  width: 32px;                 /* ✅ 分類欄更窄 */
	  padding-left: 0;
	  padding-right: 0;
	  overflow: hidden;            /* ✅ 防止 select 溢出壓到項目名稱 */
	}

	/* 項目欄撐滿剩餘空間 */
	#expenseCard th:nth-child(2), #expenseCard td:nth-child(2),
	#expenseDetails th:nth-child(2), #expenseDetails td:nth-child(2){
	  width: auto;
	  min-width: 0;
	}

	/* 金額欄 */
	#expenseCard th.expColAmt, #expenseCard td.expColAmt,
	#expenseDetails th.expColAmt, #expenseDetails td.expColAmt{
	  width: 60px;                 /* ✅ 金額欄位長度 */
	  text-align: right;
	  white-space: nowrap;
	  padding-left: 2px;
	  padding-right: 0;
	}

	/* 刪除欄（小 X） */
	#expenseCard th.expColDel,
	#expenseDetails th.expColDel{
	  width: 30px;
	  padding: 1px 2px;          /* ✅ 跟其他 th 一致，表頭就不會掉下去 */
	  vertical-align: middle;
	  text-align: center;        /* 表頭放 ↕︎ 置中 */
	}

	#expenseCard td.expColDel,
	#expenseDetails td.expColDel{
	  width: 30px;
	  padding: 0;                /* ✅ 內容列維持緊湊 */
	  vertical-align: middle;
	  text-align: right;         /* 內容列 X 靠右 */
	}
	
	
	/* ===== 花費：排序 icon（放在表頭最後一格） ===== */
	.expSortWrap{
	  position: relative;
	  width: 30px;
	  height: 30px;
	  display: flex;                 /* ✅ 改這裡：用 flex */
	  align-items: center;           /* ✅ 垂直置中 */
	  justify-content: center;       /* ✅ 水平置中 */
	  margin: 0 auto;                /* ✅ 讓它在 th 裡更穩定置中 */
	}

	.expSortBtn{
	  border: 0;
	  background: transparent;
	  color: rgba(0,0,0,.35);
	  font-size: 18px;
	  font-weight: 300;
	  line-height: 1;               /* ✅ 改回 1，交給 flex 置中 */
	  margin: 0;
	  display: block;               /* ✅ 避免 inline 的基線影響 */
	  transform: translateY(-1px);  /* ✅ 往上移：-1px ~ -4px  */
	}

	/* 透明 select 疊在 icon 上：點 icon 就會跳原生選單 */
	.expSortSelect{
	  position: absolute;
	  inset: 0;
	  opacity: 0;
	  cursor: pointer;

	  -webkit-appearance: none;
	  -moz-appearance: none;
	  appearance: none;

	/* =========================

   ========================= */
/* ===== Swipe reveal delete (LINE style) ===== */
.swipeHost{
  position: relative;
  overflow: hidden;
  touch-action: pan-y;
  --swipeX: 0px;
  --swipeW: 84px;
}

/* 刪除按鈕（固定貼右，但「整個按鈕」會跟著 swipeX + swipeW 移動）
   swipeX=0  → translateX(+W) → 完全在畫面外
   swipeX=-W → translateX(0)  → 剛好露出完整按鈕 */
.swipeActions{
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: var(--swipeW, 84px);
  background: #e5484d;
  display: flex;
  z-index: 2;
  transform: translateX(calc(var(--swipeX, 0px) + var(--swipeW, 84px)));
  transition: transform .16s ease;
  will-change: transform;
}

.swipeDeleteBtn{
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
  color: #fff;
  font-weight: 900;
  font-size: 14px;
}
/* 內容（在上面） */
.swipeContent{
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  transform: translateX(var(--swipeX, 0px));
  transition: transform .16s ease;
  will-change: transform;
}

/* ===== Todo: host 只當遮罩，樣式交給 swipeContent ===== */
.checkItem.todoRow.swipeHost{
  padding: 0;
  border: 0;
  background: transparent;
}

.checkItem.todoRow.swipeHost .swipeContent{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.78);
}

/* ===== Spot: 同理 ===== */
.spotRow.swipeHost{
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.spotRow.swipeHost .swipeContent{
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.78);
  box-shadow: 0 2px 10px rgba(40,40,60,.05);
}

/* 跟著手移動的那個（ghost）要看得到 */
.spotRow.spotGhost .swipeContent{
  opacity: .95;
}
/* 按住（尚未拖曳）先上浮：用 chosenClass */
.spotRow.spotChosen .swipeContent{
  background: rgba(255,255,255,.92);
  border-color: rgba(124,110,230,.55);
  box-shadow: 0 18px 40px rgba(0,0,0,.18);
}

/* 避免 swipeHost 的 overflow:hidden 把陰影切掉（拖曳期間才放開） */
.spotRow.spotChosen{
  overflow: visible;
}
.spotRow.spotChosen .swipeActions{
  opacity: 0;            /* 避免刪除紅底露出 */
  pointer-events: none;
}

/* 拖曳時「原位置的佔位」淡化：用 ghostClass */
.spotRow.spotGhost{
  opacity: .18;
}
.spotRow.spotGhost .swipeContent{
  box-shadow: none;
}

/* ===== Push Bell Button ===== */

.row.topActions{ justify-content: flex-end; }

.bellBtn{
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: transparent;   /* ✅ 無方框底 */
  box-shadow: none;          /* ✅ 無陰影框 */
  border-radius: 999px;      /* 只是點擊範圍圓形（看不到框） */
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  color: rgba(0,0,0,.35);    /* OFF：灰色 */
}

/* ON：黃色 */
.bellBtn.enabled{
  color: #f2b705;            /* 黃色實心 */
}

/* icon size */
.bellBtn svg{
  width: 26px;
  height: 26px;
  display:block;
}

/* 實心鈴鐺 */
.bellBtn .bell{
  fill: currentColor;
}

/* OFF 的斜槓：顏色固定深灰，避免跟灰鈴鐺混在一起看不到 */
.bellBtn .slash{
  fill: none;
  stroke: rgba(0,0,0,.55);
  stroke-width: 2.5;
  stroke-linecap: round;
}

/* ON 時不顯示斜槓 */
.bellBtn.enabled .slash{
  display: none;
}

/* ===== Card header: titleTag left, actions right ===== */
.cardHeadRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
}

.cardHeadActions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap: 8px;
  flex-wrap: nowrap;
}

.currencyInput{
  width: 96px;
  max-width: 96px;
  padding: 7px 10px;
}

.accSummary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.accTitle{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.accRight{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

.accCurrencyInput{
  width: 88px;
  padding: 6px 8px;
  height: 34px;
}

.accAddBtn{
  padding: 6px 10px;
  height: 34px;
}
/* ✅ accordion summary：不要用 space-between，避免 ::after 變第三個元素造成分散 */
details.accordion > summary.accSummary{
  justify-content: flex-start;   /* 由左到右排 */
}

/* 標題撐滿，把右邊工具推到右側 */
details.accordion > summary .accTitle{
  flex: 1 1 auto;
}

/* 右側工具固定寬，不要被擠壓 */
details.accordion > summary .accRight{
  flex: 0 0 auto;
}

/* ✅ 右側展開箭頭（chevron） */
details.accordion > summary.accSummary::after{
  content: "▾";
  color: rgba(0,0,0,.45);
  font-size: 22px;
  line-height: 1;
  margin-left: 8px;
  flex: 0 0 auto;
  transition: transform .16s ease;
}

/* 展開時箭頭朝上 */
details.accordion[open] > summary.accSummary::after{
  transform: rotate(180deg);
}


/* ===== Expense table internal vertical scroll (no horizontal) ===== */
.expTableWrap{
  max-height: clamp(220px, 45vh, 420px);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;            /* 只允許上下滑 */
}

#expenseDetails .expTableWrap{
  max-height: clamp(240px, 48vh, 560px); /* 手機可稍大 */
}

.expTableWrap table{
  width: 100%;
  table-layout: fixed;            /* 避免撐出左右 */
}

#expenseDetails table,
#expenseCard table{
  width: 100%;
  table-layout: fixed;
}

/* 表頭在內滾容器中可固定（可選，但很好用） */
.expTableWrap thead th{
  position: sticky;
  top: 0;
  z-index: 2;
  background: rgba(255,255,255,.92);
}
.expenseDetailsTa{
  min-height: 90px;

}
/* ===== Add Expense Modal footer (center scan, right save) ===== */
.expenseAddFooter{

}

.scanIconBtn{
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 14px;

  border: 1px solid rgba(124,110,230,.28);
  background: rgba(124,110,230,.12);
  color: rgba(60,50,140,.9);

  display: inline-flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  font-size: 18px;
  font-weight: 900;

  -webkit-tap-highlight-color: transparent;
}
.scanIconBtn:hover{
  background: rgba(124,110,230,.16);
  border-color: rgba(124,110,230,.38);
}
.scanIconBtn:active{
  background: rgba(124,110,230,.20);
}

/* 新增按鈕靠右 */
.expenseAddSaveBtn{
  justify-self: end;
  width: auto;            /* 不要撐滿整行 */

}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* 掃描中：只轉 icon，不轉按鈕框 */
.scanIconBtn .scanIcon{
  display: inline-block; /* 讓 transform 生效 */
}

.scanIconBtn.isSpinning .scanIcon{
  animation: spin 1.2s linear infinite;
}
.modalX{
  appearance: none;
  border: 0;
  background: transparent;   /* ✅ 沒有背景 */
  box-shadow: none;
  padding: 6px 8px;          /* 點擊範圍夠大 */

  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  color: rgba(0,0,0,.45);
}
.modalX:hover{ color: rgba(0,0,0,.70); }
.modalX:active{ color: rgba(0,0,0,.85); }

/* 純顯示版：分類 icon 的外觀（沿用原本分類欄尺寸） */
.expCatStatic{

/* 純顯示版：付款人角標（不是按鈕，只是顯示） */

.expRow .expDelBtn{ cursor: pointer; }

/* ✅ Spot modal 大圖：完整顯示，不裁切 */
#spotPhotoWall.photoWall{

  max-height: 70vh;          /* ✅ 避免長圖把 modal 撐爆 */

#spotPhotoWall.photoWall img{

/* ===== Thumb crop modal ===== */
.modal--thumbCrop{
  width: min(440px, 92vw);
  max-height: 70dvh;
  border-radius: 14px;
}

.thumbCropViewport{
  width: 100%;
  aspect-ratio: 4 / 3;              /* 跟你的縮圖 72x54 一樣比例 */
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.06);
  overflow: hidden;

  /* 用 background 來做「cover 裁切 + 拖曳」 */
  background-repeat: no-repeat;
  background-size: cover;
  background-position: 50% 50%;

  touch-action: none;               /* ✅ 讓拖曳不被頁面滾動吃掉 */
  user-select: none;
  position: relative;
}

/* 可選：加個淡淡的格線，幫助定位 */
.thumbCropViewport::after{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(to right, rgba(255,255,255,.25) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.25) 1px, transparent 1px);
  background-size: 33.33% 100%, 100% 33.33%;
  pointer-events:none;
  opacity:.35;
}

.thumbCropFooter{
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  margin-top: 12px;
  align-items: center;
}

/* ===== 日期：資料存 ISO，顯示 7/10（五） ===== */
const WEEK_ZH = ["日","一","二","三","四","五","六"];
function pad2(n){ return String(n).padStart(2,"0"); }
function isoToDate(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||""))) return null;
  const d = new Date(iso + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function dateToISO(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function formatDisplayDate(iso){
  const d = isoToDate(iso);
  if(!d) return "";
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const wk = WEEK_ZH[d.getDay()];
  return `${m}/${day}（${wk}）`;
}

function addDays(dateObj, days){
  const d = new Date(dateObj);
  d.setDate(d.getDate() + days);
  return d;
}

/* ✅ 以 Day1 為基準，自動填入後續日期（只更新 date_auto=true 的天） */
function autoFillDatesFromDay1(){
  const days = state.data?.days || [];
  if(days.length === 0) return;

  const base = isoToDate(days[0].date);
  if(!base) return;

  for(let i=0; i<days.length; i++){
    const day = days[i];
    if(day.date_auto === true || !String(day.date||"").trim()){
      day.date = dateToISO(addDays(base, i));
      day.date_auto = true;
    }
  }
}

const isMobile = () => window.matchMedia("(max-width: 900px)").matches;

function getTopCoverOffset(){
  const dock = $("dayDock");
  const h = dock ? dock.getBoundingClientRect().height : 0;
  return h + 12; // 再加一點 padding
}

function revealElement(el){
  if(!el) return;

  const offset = isMobile() ? getTopCoverOffset() : 0;
  const rect = el.getBoundingClientRect();

  const vvH = window.visualViewport ? window.visualViewport.height : window.innerHeight;

  // 目標：讓 input 顯示在 dayDock 下方一點點
  const targetTop = window.scrollY + rect.top - offset - 12;

  // 防止捲到超過頁底
  const maxTop = Math.max(0, document.documentElement.scrollHeight - vvH);

  window.scrollTo({
    top: Math.max(0, Math.min(maxTop, targetTop)),
    behavior: "auto"
  });
}

function focusAndSelect(el){
  if(!el) return;

  // 1) focus 但不要讓瀏覽器自動 scroll（避免 iOS 自己多捲）
  try{
    el.focus({ preventScroll: true });
  }catch{
    el.focus();
  }

  // 2) 先做一次定位（有些機型 visualViewport 不會 resize）
  requestAnimationFrame(() => revealElement(el));

  // 3) 等鍵盤導致 viewport resize「穩定」後，再做最後一次定位（只一次）
  if(isMobile() && window.visualViewport){
    const vv = window.visualViewport;
    let timer = null;

    const onResize = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        vv.removeEventListener("resize", onResize);
        revealElement(el);
      }, 80); // 等 resize 事件停止
    };

    vv.addEventListener("resize", onResize, { passive:true });

    // 保險：最多等 500ms，避免 listener 一直掛著
    setTimeout(() => vv.removeEventListener("resize", onResize), 500);
  }

  // 4) 選取文字
  setTimeout(() => el.select?.(), 0);
}
function pickVisible(selector){
  const els = Array.from(document.querySelectorAll(selector));
  return els.find(el => el.offsetParent !== null && el.getClientRects().length) || null;
}

function getDefaultTodoCatId(){

function ensureTodoFilterValid(){
  if(state.todoFilter === "all") return;
  const ok = (state.data?.todoCategories || []).some(c => c.id === state.todoFilter);
  if(!ok) state.todoFilter = "all";
}

function calcTodoCounts(){
  const counts = new Map();
  const todos = state.data?.tripTodos || [];
  const fallback = getDefaultTodoCatId();

  for(const t of todos){
    if(t.done) continue; // ✅ 只算未打勾
    const cid = t.categoryId || fallback;
    if(!cid) continue;
    counts.set(cid, (counts.get(cid) || 0) + 1);
  }
  return counts;
}


async function deleteTodoCategory(catId){
	
	if(!await requireEdit("刪除分類")) return;
	
  const cats = state.data?.todoCategories || [];
  if(cats.length <= 1){
    alert("至少要保留 1 個分類");
    return;
  }

  const idx = cats.findIndex(c => c.id === catId);
  if(idx < 0) return;

  const cat = cats[idx];
  if(!confirm(`確定刪除分類「${cat.name}」？\n此分類的待辦會移到另一個分類。`)) return;

  // fallback：找一個不是自己且存在的分類
  const fallback = cats.find(c => c.id !== catId)?.id;
  if(!fallback){
    alert("至少要保留 1 個分類");
    return;
  }

  // 把該分類 todo 轉移
  for(const t of (state.data.tripTodos || [])){
    if(t.categoryId === catId) t.categoryId = fallback;
  }

  // 刪分類
  cats.splice(idx, 1);

  // 若當前正在看被刪掉的 tab → 回到 all
  if(state.todoFilter === catId) state.todoFilter = "all";

  saveToDb(true);
  renderTodoTabs();
  renderTodos();
}

function initTodoTabUIOnce(){
  const bindRoot = (root) => {
    if(!root) return;
    if(root.dataset.bound === "1") return;
    root.dataset.bound = "1";

    let timer = null;
    let longPressed = false;
    let pressedCatId = null;

    const clear = () => {
      if(timer){
        clearTimeout(timer);
        timer = null;
      }
      pressedCatId = null;
    };

    const startPress = (e) => {
      const tab = e.target?.closest?.(".todoTab[data-todo-cat-id]");
      if(!tab || !root.contains(tab)) return;

      longPressed = false;
      pressedCatId = tab.dataset.todoCatId;

      clearTimeout(timer);
      timer = setTimeout(() => {
			  longPressed = true;

			  // ✅ 清掉可能已經產生的文字選取（避免長按時把字反白）
			  const sel = window.getSelection?.();
			  if(sel && sel.removeAllRanges) sel.removeAllRanges();

			  editTodoCategory(pressedCatId);
			  clear();
			}, 550);

    };

    const cancelPress = () => clear();

    // 長按偵測（不要 preventDefault，避免影響滾動/點擊）
    root.addEventListener("touchstart", startPress, { passive:true });
    root.addEventListener("touchend", cancelPress, { passive:true });
    root.addEventListener("touchcancel", cancelPress, { passive:true });
    root.addEventListener("touchmove", cancelPress, { passive:true });

    root.addEventListener("pointerdown", startPress, { passive:true });
    root.addEventListener("pointerup", cancelPress, { passive:true });
    root.addEventListener("pointercancel", cancelPress, { passive:true });
    root.addEventListener("pointermove", cancelPress, { passive:true });

    // 點一下切換/新增（長按觸發後會把 click 吃掉）
    root.addEventListener("click", (e) => {
      const add = e.target.closest(".todoTab[data-todo-tab-add]");
      if(add && root.contains(add)){
        if(longPressed){ longPressed = false; return; }
        addTodoCategory();
        return;
      }

      const tab = e.target.closest(".todoTab[data-todo-tab]");
      if(!tab || !root.contains(tab)) return;

      if(longPressed){
        longPressed = false;
        return;
      }

      const id = tab.dataset.todoTab;
      if(!id) return;
      setTodoFilter(id);
    });
  };

  bindRoot($("todoTabs"));
  bindRoot($("todoTabs_m"));
}

/* ===== Image to jpeg ===== */
async function fileToJpegBlob(file, maxW = 1600, quality = 0.85){
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = URL.createObjectURL(file);
  });

  const scale = Math.min(1, maxW / img.naturalWidth);
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);

  return await new Promise((resolve) => {
    canvas.toBlob((b) => resolve(b), "image/jpeg", quality);
  });
}
async function uploadJpegToStorage(path, blob){
  const { error } = await supabase.storage.from(BUCKET).upload(path, blob, {
    upsert: true,
    cacheControl: "3600",
    contentType: "image/jpeg"
  });
  if(error) throw error;
}
async function removePaths(paths){
  const clean = (paths || []).filter(Boolean);
  if(!clean.length) return;

  const { error } = await supabase.storage.from(BUCKET).remove(clean);
  if(error){
    // 不要阻擋流程（常見是權限不足 / 檔不存在）
    console.warn("storage.remove failed:", error.message || error);
  }
}

async function removeFolder(prefix){
  // Supabase Storage 沒有「刪資料夾」，要先 list 裡面的檔再 remove
  try{
    const { data, error } = await supabase.storage
      .from(BUCKET)
      .list(prefix, { limit: 1000 });

    if(error){
      console.warn("storage.list failed:", error.message || error);
      return;
    }
    if(!data?.length) return;

    const paths = data
      .filter(x => x?.name)
      .map(x => `${prefix}/${x.name}`);

    await removePaths(paths);
  }catch(e){
    console.warn("removeFolder exception:", e);
  }
}

/* ===== normalize ===== */
function normalizeNotebook(nb, tripTitle){
  nb.tripTitle = tripTitle || nb.tripTitle || "旅遊筆記";
  //刪掉原本Json存法資料
  if ("currency" in nb) delete nb.currency;
	if ("tripExpenses" in nb) delete nb.tripExpenses;
  if(!Array.isArray(nb.todoCategories) || nb.todoCategories.length === 0){
	  nb.todoCategories = [
	    { id: uid(), name: "事項" },
	    { id: uid(), name: "吃的" },
	    { id: uid(), name: "購物" }
	  ];
	}
  if(!Array.isArray(nb.tripTodos)) nb.tripTodos = [];
  if(!Array.isArray(nb.days) || nb.days.length === 0){
    nb.days = defaultNotebook(nb.tripTitle).days;
  }

  for(const day of nb.days){
    day.id ||= uid();
    day.name ||= "Day";
    day.date ||= "";
    if(typeof day.date_auto !== "boolean"){
      day.date_auto = !String(day.date || "").trim();
    }
    day.theme ||= "";
    day.stay ||= "";
    day.stay_photo_path ||= "";
    day.stay_photo_updated_at ||= "";
    day.notes ||= "";
    if(!day.notes_by_role || typeof day.notes_by_role !== "object"){
		  day.notes_by_role = { J: "", V: "" };
		}

		// 舊資料：如果 notes_by_role 都空，但 day.notes 有內容 → 放到 J
		const jEmpty = !String(day.notes_by_role.J || "").trim();
		const vEmpty = !String(day.notes_by_role.V || "").trim();
		if((jEmpty && vEmpty) && String(day.notes || "").trim()){
		  day.notes_by_role.J = day.notes;
		}
    if(!Array.isArray(day.spots)) day.spots = [];

    for(const s of day.spots){
      s.id ||= uid();
      s.title ||= "";
      s.photo_path ||= "";
      s.photo_updated_at ||= "";
      if(!Array.isArray(s.comments)) s.comments = [];
      
      // ✅ 縮圖裁切焦點（百分比）
		  if(typeof s.thumbPosX !== "number") s.thumbPosX = 50; // 0~100
		  if(typeof s.thumbPosY !== "number") s.thumbPosY = 50; // 0~100

      // 舊資料相容：memo_by_role -> comments
      if(s.memo_by_role && typeof s.memo_by_role === "object"){
        const male = (s.memo_by_role.male || "").trim();
        const female = (s.memo_by_role.female || "").trim();
        if(male) s.comments.push({ id: uid(), role:"J", text: male });
        if(female) s.comments.push({ id: uid(), role:"V", text: female });
        delete s.memo_by_role;
      }
      if(typeof s._notifyNewSpot !== "boolean") s._notifyNewSpot = false;
    }
  }

  // ✅ 花費分類：可自訂（改名後不會被硬改回交通）
if(!Array.isArray(nb.expenseCategories) || nb.expenseCategories.length === 0){
		  nb.expenseCategories = [
		    { id: uid(), name: "餐飲", icon: "🍜" },
		    { id: uid(), name: "購物", icon: "🛍️" },
		    { id: uid(), name: "交通", icon: "🚃" },
		    { id: uid(), name: "甜點", icon: "🍰" },
		    { id: uid(), name: "娛樂", icon: "🕹️" }
		  ];
		}

  const catByName = new Map(nb.todoCategories.map(c => [c.name, c.id]));
	const defaultCatId = nb.todoCategories[0]?.id;

	for(const t of nb.tripTodos){
	  t.id ||= uid();
	  t.text = String(t.text || "");
	  t.done = !!t.done;

	  // 舊資料相容：category(名稱) -> categoryId
	  if(!t.categoryId){
	    const oldName = String(t.category || "").trim();
	    t.categoryId = catByName.get(oldName) || defaultCatId;
	  }
	  delete t.category;
	}

  return nb;
}

function normalizeAmountForDb(v){
  // 允許小數到第 2 位；空字串 => null
  const s = String(v ?? "").trim();
  if(!s) return null;

  // 只留下數字/負號/小數點
  const cleaned = s.replace(/[^\d.-]/g, "");

  // 避免 "1.2.3" 這種
  const n = Number(cleaned);
  if(!isFinite(n)) return null;

  // round to 2 decimals
  return Math.round(n * 100) / 100;
}

/* ===== dayDock iOS fallback ===== */
function setupDayDockPin(){
  const mql = window.matchMedia("(max-width: 900px)");
  if(!mql.matches) return;

  const dock = $("dayDock");
  const spacer = $("dayDockSpacer");
  if(!dock || !spacer) return;

  const getStickTop = () => {
    const t = parseFloat(getComputedStyle(dock).top || "0");
    return isFinite(t) ? t : 0;
  };

  const update = () => {
    const stickTop = getStickTop();
    const baseRect = dock.classList.contains("isFixed")
      ? spacer.getBoundingClientRect()
      : dock.getBoundingClientRect();

    const shouldFix = baseRect.top <= stickTop;

    if(shouldFix && !dock.classList.contains("isFixed")){
      spacer.style.display = "block";
      spacer.style.height = dock.offsetHeight + "px";
      dock.classList.add("isFixed");
    }else if(!shouldFix && dock.classList.contains("isFixed")){
      dock.classList.remove("isFixed");
      spacer.style.display = "none";
      spacer.style.height = "0px";
    }
  };

  window.addEventListener("scroll", update, { passive:true });
  window.addEventListener("resize", () => {
    dock.classList.remove("isFixed");
    spacer.style.display = "none";
    spacer.style.height = "0px";
    update();
  }, { passive:true });

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", update, { passive:true });
    window.visualViewport.addEventListener("scroll", update, { passive:true });
  }

  update();
}

function bindSwipeReveal({
  hostEl,                 // 外層容器（要 position:relative & overflow:hidden）
  setTranslateX,          // (x)=>void，把內容推移
  width = 84,             // 刪除按鈕寬度
  onDelete,               // () => void
  ignoreSelector = ""    //  這些元素上開始滑動就不處理 swipe
}){
  hostEl.style.setProperty("--swipeW", width + "px");

  let startX = 0, startY = 0;
  let dx = 0;
  let dragging = false;
  let locked = null; // null | "h" | "v"
  let open = false;

  const setX = (x) => {
	  hostEl.style.setProperty("--swipeX", x + "px");
	};

  const close = () => { open = false; setX(0); };
  const openIt = () => { open = true; setX(-width); };

  hostEl.addEventListener("pointerdown", (e) => {
    // 任何 pointer 都可以（手機/桌機都能拖出刪除鈕）
    if(ignoreSelector && e.target.closest(ignoreSelector)) return;
    dragging = true;
    locked = null;
    dx = 0;
    startX = e.clientX;
    startY = e.clientY;

    hostEl.setPointerCapture?.(e.pointerId);
  }, { passive:true });

  hostEl.addEventListener("pointermove", (e) => {
    if(!dragging) return;

    const mx = e.clientX - startX;
    const my = e.clientY - startY;

    if(locked === null){
      locked = (Math.abs(my) > Math.abs(mx)) ? "v" : "h";
    }
    if(locked === "v"){
      dragging = false;
      return;
    }

    // 水平滑動：只允許左滑露出、右滑收回
    e.preventDefault();

    // 如果正在編輯 input，滑動時先 blur，避免選字怪異
    const ae = document.activeElement;
    if(ae && hostEl.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
      ae.blur();
    }

    const base = open ? -width : 0;
    const next = base + mx;         // mx<0 會往左
    dx = Math.max(-width, Math.min(0, next));
    setX(dx);
  }, { passive:false });

  hostEl.addEventListener("pointerup", (e) => {
    if(!dragging) return;
    dragging = false;
    hostEl.releasePointerCapture?.(e.pointerId);

    // 放開時「吸附」：滑過一半就打開，否則關閉
    if(dx <= -width/2) openIt();
    else close();

    // 若剛剛是水平滑動，吃掉一次 click，避免誤觸（例如打開 spot modal）
    if(locked === "h"){
      hostEl.addEventListener("click", (ev) => {
	    // ✅ 讓「刪除鈕」可以被點到，不要吃掉
	    if(ev.target.closest(".swipeDeleteBtn")) return;

	    ev.preventDefault();
	    ev.stopPropagation();
      }, { capture:true, once:true });
    }
  }, { passive:true });

  hostEl.addEventListener("pointercancel", () => {
    dragging = false;
    close();
  }, { passive:true });

  // 點內容區（非刪除鈕）時，如果已開啟，就先關閉，不做其他事
  hostEl.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".swipeDeleteBtn");
    if(delBtn) return;

    if(open){
      e.preventDefault();
      e.stopPropagation();
      close();
    }
  }, true);

  // 刪除鈕點下去：直接刪，不再 confirm
  hostEl.querySelector(".swipeDeleteBtn")?.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    onDelete?.();
  });

  return { close, open: openIt };
}

function openThumbCropper(){
  const spot = state.activeSpotId ? getSpotById(state.activeSpotId) : null;
  if(!spot) return;

  if(!spot.photo_path){
    alert("請先上傳景點照片，才能調整縮圖");
    return;
  }

  const url = getPublicUrl(spot.photo_path, spot.photo_updated_at || "");

  // 初始值
  const x0 = Number(spot.thumbPosX);
	const y0 = Number(spot.thumbPosY);
	const x = Number.isFinite(x0) ? x0 : 50;
	const y = Number.isFinite(y0) ? y0 : 50;

  state.thumbCrop = {
    spotId: spot.id,
    url,
    posX: x,
    posY: y,
    // cover 計算用
    imgW: 0, imgH: 0,
    viewW: 0, viewH: 0,
    dispW: 0, dispH: 0
  };

  const viewport = $("thumbCropViewport");
  viewport.style.backgroundImage = `url('${url}')`;
  viewport.style.backgroundPosition = `${x}% ${y}%`;

  // 先開 modal
  $("thumbCropMask").style.display = "flex";
  $("thumbCropMask").setAttribute("aria-hidden","false");

  // 取得圖片原始尺寸 + 計算 cover 幾何（拖曳要用）
  const img = new Image();
  img.onload = () => {
    state.thumbCrop.imgW = img.naturalWidth || 0;
    state.thumbCrop.imgH = img.naturalHeight || 0;

    requestAnimationFrame(() => {
      const r = viewport.getBoundingClientRect();
      state.thumbCrop.viewW = r.width;
      state.thumbCrop.viewH = r.height;

      // cover 後實際顯示尺寸
      const scale = Math.max(r.width / state.thumbCrop.imgW, r.height / state.thumbCrop.imgH);
      state.thumbCrop.dispW = state.thumbCrop.imgW * scale;
      state.thumbCrop.dispH = state.thumbCrop.imgH * scale;
    });
  };
  img.src = url;
}

function closeThumbCropper(){
  state.thumbCrop = null;
  $("thumbCropMask").style.display = "none";
  $("thumbCropMask").setAttribute("aria-hidden","true");
  const viewport = $("thumbCropViewport");
  viewport.style.backgroundImage = "";
}

function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

// 把 pos% 轉成「背景偏移 px」（用於拖曳累加）
function posPercentToOffsetPx(posPct, view, disp){
  if(disp <= view) return 0;
  const range = view - disp;                 // 這是負數
  return range * (posPct / 100);
}

// 把 offset px 轉回 pos%
function offsetPxToPosPercent(offsetPx, view, disp){
  if(disp <= view) return 50;
  const range = view - disp;                 // 負數
  return (offsetPx / range) * 100;
}

    preventOnFilter: false,
    ghostClass: "spotGhost",
    chosenClass: "spotChosen",
    dragClass: "spotDrag",
    fallbackOnBody: true,
  // ✅ 手機長按才開始拖曳（避免一滑就進入排序）

	  delayOnTouchOnly: true,  // 只在觸控生效，桌機仍可直接拖

	  								 box.querySelectorAll(".spotRow").forEach(el => el.style.setProperty("--swipeX","0px"));
	  								},
  	onEnd: async () => {

      renderSpotList();

  });

function renderTodos(){
  renderTodoTabs(); // ✅ 讓兩邊 tab 隨資料更新（數量/active）

  const allTodos = state.data.tripTodos || [];
  const targets = [$("todoList"), $("todoList_m")].filter(Boolean);
  targets.forEach(t => t.innerHTML = "");

  const fallback = getDefaultTodoCatId();

  const todos = allTodos.filter(t => {
    const cid = t.categoryId || fallback;
    if(state.todoFilter === "all") return true;
    return cid === state.todoFilter;
  });
  
  const todosSorted = todos
  .slice()
  .sort((a,b) => Number(a.done) - Number(b.done)); // false(0) 先、true(1) 後

  if(!todosSorted.length){
    targets.forEach(t => {
      const empty = document.createElement("div");
      empty.className = "muted";
      empty.textContent = "此分類尚無待辦";
      t.appendChild(empty);
    });
    return;
  }

  targets.forEach(t => {
    todosSorted.forEach((todo) => {
      const row = document.createElement("div");
			row.className = "checkItem todoRow swipeHost";
			row.dataset.todoId = todo.id;

			row.innerHTML = `
			  <div class="swipeContent">
			    <input type="checkbox" ${todo.done ? "checked" : ""} />
			    <input class="todoTextInput" data-todo-id="${escapeAttr(todo.id)}"
			           type="text" value="${escapeAttr(todo.text || "")}" placeholder="待辦內容" />
			  </div>
			  <div class="swipeActions">
			    <button class="swipeDeleteBtn" type="button">刪除</button>
			  </div>
			`;
			
			const content = row.querySelector(".swipeContent");

			// 綁 swipe（不 confirm）
			bindSwipeReveal({
			  hostEl: row,
			  width: 84,
			  setTranslateX: (x) => content.style.setProperty("--swipeX", x + "px"),
			  onDelete: () => deleteTodoById(todo.id)
			});

			
			
      const cb = row.querySelector('input[type="checkbox"]');
      const tx = row.querySelector('input[type="text"]');
      
      cb.disabled = !CAN_EDIT;     // ✅ checkbox 不吃 readOnly，只能 disabled
			tx.readOnly = !CAN_EDIT;     // ✅ 文字用 readOnly

      cb.onchange = async () => {
      	const prev = !!todo.done;

			  if(!await requireEdit("勾選待辦")){
			    cb.checked = prev;        // ✅ Cancel 後 UI 回復
			    return;
			  }
			  todo.done = cb.checked;
			  if(!todo._draft) saveToDb();
			  renderTodoTabs();
			  renderTodos(); // ✅ 立刻重排：已完成移到下面
			};

      tx.oninput = async () => {
      	const prev = todo.text || "";

			  if(!await requireEdit("修改待辦")){
			    tx.value = prev;          // ✅ 回復
			    return;
			  }
        todo.text = tx.value;
        if(todo._draft && String(todo.text || "").trim()){
          todo._draft = false;
        }
        if(!todo._draft) saveToDb();
      };

      tx.onblur = () => {
        if(todo._draft && !String(todo.text || "").trim()){
          const i = state.data.tripTodos.findIndex(x => x.id === todo.id);
          if(i >= 0) state.data.tripTodos.splice(i, 1);
          renderTodos();
        }
      };

      t.appendChild(row);
    });
  });
}

function getExpenseCats(){
  return state.data?.expenseCategories || [];
}

function parseAmount(v){
  const n = Number(String(v ?? "").replace(/[^\d.-]/g,""));
  return isFinite(n) ? n : 0;
}
function calcExpenseSums(){
  const rows = state.expenses || [];
  const cats = getExpenseCats();

  // sums.all: { total, J, V }
  const sums = { all: { total: 0, J: 0, V: 0 } };

  // sums[catName] = total
  for(const c of cats) sums[c.name] = 0;

  for(const x of rows){
    const a = parseAmount(x.amount);

    // ALL: total + payer breakdown
    sums.all.total += a;
    const payer = (x.payer === "V") ? "V" : "J"; // 預設 J
    sums.all[payer] += a;

    // 每個分類只算 total（不算 J/V）
    if(sums[x.category] !== undefined){
      sums[x.category] += a;
    }
  }

  return sums;
}
function makeUniqueExpenseCatName(base="新分類"){
  const cats = getExpenseCats();
  if(!cats.some(c => c.name === base)) return base;
  let i = 2;
  while(cats.some(c => c.name === `${base}${i}`)) i++;
  return `${base}${i}`;
}

function updateExpenseSumUI(){
  const sums = calcExpenseSums();
  const cur = String(state.currency ?? "JPY").trim();
  const sumHtml = (n) => {
	  const amt = formatNumber(n);
	  return cur
	    ? `<span class="sumAmt">${escapeHtml(amt)}</span><span class="sumCcy">${escapeHtml(cur)}</span>`
	    : `<span class="sumAmt">${escapeHtml(amt)}</span>`;
	};
  	
  const allJVText = (obj) => `💪 ${formatNumber(obj?.J || 0)}  🐽 ${formatNumber(obj?.V || 0)}`;
  const cats = getExpenseCats();

  const build = (el) => {
    if(!el) return;

    const mk = (cat) => {
      const active = state.expenseFilter === cat.name;

      // 未選中：只顯示 icon
      if(!active){
        return `
          <div class="sumBox"
               data-cat="${escapeAttr(cat.name)}"
               data-exp-cat-id="${escapeAttr(cat.id)}">
            ${escapeHtml(cat.icon || "•")}
          </div>
        `;
      }

      // ✅ 選中某分類：只顯示「分類加總」(不顯示 J/V)
      return `
        <div class="sumBox active"
             data-cat="${escapeAttr(cat.name)}"
             data-exp-cat-id="${escapeAttr(cat.id)}">
          ${escapeHtml(cat.icon || "•")} ${escapeHtml(cat.name)} ${sumHtml(sums[cat.name] || 0)}
        </div>
      `;
    };

    // ✅ ALL：只有選中時才顯示 total + J/V；沒選中就只顯示 ALL
    const allHtml = (state.expenseFilter === "all")
	  ? `ALL ${sumHtml(sums.all.total)} <span class="sumMini">${escapeHtml(allJVText(sums.all))}</span>`
	  : `ALL`;

    el.innerHTML = `
      <div class="sumBox ${state.expenseFilter === "all" ? "active" : ""}" data-cat="all">
        ${allHtml}
      </div>
      ${cats.map(mk).join("")}
      <div class="sumBox add" data-exp-cat-add title="新增分類">＋</div>
    `;
  };

  build($("expenseSums"));
  build($("expenseSums_m"));
}

async function saveExpenseCatRename(){
  if(!await requireEdit("調整分類")) return;

  const catId = state.editingExpenseCatId;
  if(!catId) return;

  const cats = getExpenseCats();
  const cat = cats.find(c => c.id === catId);
  if(!cat) return;

  const oldName = cat.name;

  const nextName = ($("expenseCatName").value || "").trim();
  const nextIcon = ($("expenseCatIcon").value || "").trim();
  if(!nextName) return;

  // 避免重名（排除自己）
  if(cats.some(c => c.name === nextName && c.id !== catId)){
    alert("分類名稱已存在");
    return;
  }

  // 1) 先更新 notebook 內的分類表（UI/狀態）
  cat.name = nextName;
  cat.icon = nextIcon;

  // 2) 先更新前端記憶體（讓畫面立即正確）
  for(const e of (state.expenses || [])){
    if(e.category === oldName) e.category = nextName;
  }
  if(state.expenseFilter === oldName) state.expenseFilter = nextName;

  // 3) ✅ 批次更新 DB（trip_expenses）
  // 只有「真的改名」才需要打 DB
  if(oldName !== nextName){
    const { error } = await supabase
      .from("trip_expenses")
      .update({ category: nextName })
      .eq("trip_id", tripId)
      .eq("category", oldName);

    if(error){
      console.error(error);
      alert("分類改名同步到花費失敗：" + (error.message || JSON.stringify(error)));
      // 你要更嚴謹可在此做 rollback（把 cat/name、state.expenses 改回 oldName）
      return;
    }
  }

  // 4) ✅ 存 notebook（expenseCategories 仍在 notebook JSON）
  await saveToDb(true);

  closeExpenseCatEditor();
  renderExpenses();
  updateExpenseSumUI();
}

async function deleteExpenseCategory(){
  if(!await requireEdit("刪除分類")) return;

  const catId = state.editingExpenseCatId;
  if(!catId) return;

  const cats = getExpenseCats();
  if(cats.length <= 1){
    alert("至少要保留 1 個分類");
    return;
  }

  const idx = cats.findIndex(c => c.id === catId);
  if(idx < 0) return;

  const cat = cats[idx];
  const oldName = cat.name;

  // fallback：刪掉後要把原本的費用移過去
  const fallback = cats.find(c => c.id !== catId);
  if(!fallback) return;

  if(!confirm(`確定刪除分類「${oldName}」？\n此分類的花費會移到「${fallback.name}」。`)) return;

  // 1) 先更新前端記憶體（畫面立即正確）
  for(const e of (state.expenses || [])){
    if(e.category === oldName) e.category = fallback.name;
  }
  if(state.expenseFilter === oldName) state.expenseFilter = "all";

  // 2) ✅ 先批次更新 DB（把舊分類的花費搬到 fallback）
  const { error } = await supabase
    .from("trip_expenses")
    .update({ category: fallback.name })
    .eq("trip_id", tripId)
    .eq("category", oldName);

  if(error){
    console.error(error);
    alert("分類刪除搬移花費失敗：" + (error.message || JSON.stringify(error)));
    return;
  }

  // 3) 刪 notebook 內分類表
  cats.splice(idx, 1);

  // 4) ✅ 存 notebook（expenseCategories 仍在 notebook JSON）
  await saveToDb(true);

  closeExpenseCatEditor();
  renderExpenses();
  updateExpenseSumUI();
}

function renderExpenses(){
  const rows = state.expenses || [];

  const filtered = rows
    .map((x, idx) => ({ x, idx }))
    .filter(({x}) => state.expenseFilter === "all" ? true : x.category === state.expenseFilter);

  let view = filtered.slice();
  const sortKey = state.expenseSort || "new";

  if(sortKey === "old"){
    view.reverse();
  }else if(sortKey === "amtDesc"){
    view.sort((a,b) => {
      const d = parseAmount(b.x.amount) - parseAmount(a.x.amount);
      return d !== 0 ? d : (a.idx - b.idx);
    });
  }else if(sortKey === "amtAsc"){
    view.sort((a,b) => {
      const d = parseAmount(a.x.amount) - parseAmount(b.x.amount);
      return d !== 0 ? d : (a.idx - b.idx);
    });
  }
  // sortKey === "new"：不動（新到舊）

  const bodies = [$("expenseBody"), $("expenseBody_m")].filter(Boolean);
  bodies.forEach(b => b.innerHTML = "");

  const cats = getExpenseCats();
  const fallbackCat = cats[0]?.name || "餐飲";

  const getCatIcon = (catName) => {
    const c = cats.find(c => c.name === catName);
    return c?.icon || "•";
  };

  const payerIcon = (p) => (p === "V" ? "🐽" : "💪");

  const renderTo = (bodyEl) => {
    if(!filtered.length){
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="4" class="muted">此分類沒有花費紀錄</td>`;
      bodyEl.appendChild(tr);
      return;
    }

    view.forEach(({x}) => {
      x.id ||= uid();
      x.name ||= "";
      if(x.amount === undefined) x.amount = "";
      if(x.payer !== "J" && x.payer !== "V") x.payer = "J";

      // 若分類不存在 → 回到第一個分類
      if(!cats.some(c => c.name === x.category)){
        x.category = fallbackCat;
      }

      const tr = document.createElement("tr");
      tr.className = "expRow";
      tr.dataset.expId = x.id;

      const icon = getCatIcon(x.category);
      const name = String(x.name || "").trim() || "（未命名）";

      // 顯示用金額
      const amtNum = parseAmount(x.amount);
      const amtText = (String(x.amount ?? "").trim() === "") ? "" : formatNumber(amtNum);

      tr.innerHTML = `
        <td class="expColCat">
          <div class="expCatWrap">
            <div class="expCatStatic" aria-hidden="true">${escapeHtml(icon)}</div>
            <div class="expPayerBadge" title="付款人">${escapeHtml(payerIcon(x.payer))}</div>
          </div>
        </td>
        <td title="${escapeAttr(name)}">
          <div class="expNameText">${escapeHtml(name)}</div>
        </td>
        <td class="right expColAmt">${escapeHtml(amtText)}</td>
        <td class="expColDel"></td>
      `;

      // 刪除按鈕（仍保留）
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "expDelBtn";
      delBtn.textContent = "✕";
      delBtn.title = "刪除";
      delBtn.disabled = !CAN_EDIT;

      delBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if(!CAN_EDIT) return;
        if(confirm("確定刪除這筆花費紀錄？")){
          deleteExpenseById(x.id);
        }
      });

      tr.children[3].appendChild(delBtn);

      // ✅ 點整列開 modal（排除點到刪除按鈕）
      tr.addEventListener("click", (e) => {
        if(e.target.closest(".expDelBtn")) return;
        openExpenseEditModal(x.id);
      });

      bodyEl.appendChild(tr);
    });
  };

  bodies.forEach(renderTo);
  updateExpenseSumUI();
}

async function deleteDayById(dayId){
	
	if(!await requireEdit("刪除天數")) return;
	
  const d = state.data.days.find(x => x.id === dayId);
  if(!d) return;

  if(!confirm(`確定刪除「${d.name}」？此操作無法復原。`)) return;

  try{
    // 1) 刪住宿照
    if(d.stay_photo_path) await removePaths([d.stay_photo_path]);
    else await removePaths([`${tripId}/stay/${d.id}.jpg`]);

    // 2) 刪景點照片（先刪記錄到的，再刪資料夾殘留）
    const spotPaths = (d.spots || []).map(s => s.photo_path).filter(Boolean);
    await removePaths(spotPaths);
    await removeFolder(`${tripId}/spots/${d.id}`);

    // 3) 刪 day 資料
    const idx = state.data.days.findIndex(x => x.id === d.id);
    if(idx >= 0) state.data.days.splice(idx, 1);

    if(!state.data.days.length){
      state.data.days = defaultNotebook(state.data.tripTitle).days;
    }
    state.activeDayId = state.data.days[0].id;

    autoFillDatesFromDay1();
    await saveToDb(true);
    renderAll();
  }catch(err){
    console.error(err);
    alert("刪除失敗：" + (err.message || JSON.stringify(err)));
  }
}

function openDayCtxMenu(dayId, clientX, clientY){
  dayCtxDayId = dayId;

  dayCtxMenu.style.display = "block";
  dayCtxMenu.setAttribute("aria-hidden","false");

  const pad = 10;
  const rect = dayCtxMenu.getBoundingClientRect();

  let x = clientX;
  let y = clientY;

  const maxX = window.innerWidth - rect.width - pad;
  const maxY = window.innerHeight - rect.height - pad;

  x = Math.max(pad, Math.min(maxX, x));
  y = Math.max(pad, Math.min(maxY, y));

  dayCtxMenu.style.left = x + "px";
  dayCtxMenu.style.top  = y + "px";

  dayCtxOpen = true;
}

// 綁在每張 dayItem 上
function bindDayLongPressMenu(dayEl, dayId){
  let timer = null;
  let longPressed = false;
  let sx = 0, sy = 0;

  const clear = () => { if(timer) clearTimeout(timer); timer = null; };

  dayEl.addEventListener("pointerdown", (e) => {
    // 排除：點日期 pill（避免跟改日期衝突）
    if(e.target.closest(".pill")) return;

    longPressed = false;
    sx = e.clientX; sy = e.clientY;

    clear();
    timer = setTimeout(() => {
      longPressed = true;
      // ✅ 清掉可能已經產生的文字選取
		  const sel = window.getSelection?.();
		  if(sel && sel.removeAllRanges) sel.removeAllRanges();
      openDayCtxMenu(dayId, e.clientX, e.clientY);
    }, 550);
  }, { passive:true });

  dayEl.addEventListener("pointermove", (e) => {
    if(!timer) return;
    if(Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clear();
  }, { passive:true });

  dayEl.addEventListener("pointerup", clear, { passive:true });
  dayEl.addEventListener("pointercancel", clear, { passive:true });

  // 長按後吃掉 click，避免切換 day
  dayEl.addEventListener("click", (e) => {
    if(!longPressed) return;
    e.preventDefault();
    e.stopPropagation();
    longPressed = false;
  }, true);

  // 桌機右鍵也能叫出
  dayEl.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    openDayCtxMenu(dayId, e.clientX, e.clientY);
  });
}

async function scanReceiptFile(file){

  // ✅ 組 FormData 上傳到 Worker
  const fd = new FormData();
  fd.append("file", blob, "receipt.jpg");

  const res = await fetch(`${PUSH_WORKER}/api/ocr/receipt`, {
    method: "POST",
    body: fd
  });

  const data = await res.json().catch(() => ({}));
  if(!res.ok || !data.ok){
    throw new Error(data.error || `HTTP ${res.status}`);
  }

  // data: { ok:true, merchant, total, categoryGuess, currency }
  return data;
}

	});

	// ✅ 儲存
	$("thumbCropSave")?.addEventListener("click", saveThumbCropper);

	// ✅ 拖曳操作（pointer）
	{
	  const viewport = $("thumbCropViewport");
	  let dragging = false;
	  let sx = 0, sy = 0;
	  let startOffX = 0, startOffY = 0;

	  viewport.addEventListener("pointerdown", (e) => {
	    const c = state.thumbCrop;
	    if(!c) return;

			if(!(c.viewW > 0 && c.viewH > 0 && c.dispW > 0 && c.dispH > 0)) return;
			
	    dragging = true;
	    sx = e.clientX; sy = e.clientY;

	    // 把目前 pos% 轉成 offset(px) 當作拖曳起點
	    startOffX = posPercentToOffsetPx(c.posX, c.viewW, c.dispW);
	    startOffY = posPercentToOffsetPx(c.posY, c.viewH, c.dispH);

	    viewport.setPointerCapture?.(e.pointerId);
	  });

	  viewport.addEventListener("pointermove", (e) => {
	    if(!dragging) return;
	    const c = state.thumbCrop;
	    if(!c) return;

	    e.preventDefault();

	    const dx = e.clientX - sx;
	    const dy = e.clientY - sy;

	    // offset(px) += 拖曳位移
	    let offX = startOffX + dx;
	    let offY = startOffY + dy;

	    // clamp 在可裁切範圍內：[(view-disp) , 0]
	    const minX = c.viewW - c.dispW;
	    const minY = c.viewH - c.dispH;

	    offX = clamp(offX, minX, 0);
	    offY = clamp(offY, minY, 0);

	    // 轉回 pos%
	    c.posX = clamp(offsetPxToPosPercent(offX, c.viewW, c.dispW), 0, 100);
	    c.posY = clamp(offsetPxToPosPercent(offY, c.viewH, c.dispH), 0, 100);

	    viewport.style.backgroundPosition = `${c.posX}% ${c.posY}%`;
	  }, { passive:false });

	  const end = (e) => {
	    if(!dragging) return;
	    dragging = false;
	    viewport.releasePointerCapture?.(e.pointerId);
	  };

	  viewport.addEventListener("pointerup", end);
	  viewport.addEventListener("pointercancel", end);
	}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function ensureServiceWorkerReady(){
  if(!("serviceWorker" in navigator)) throw new Error("No serviceWorker support");

  // ✅ 只 register 一次
  const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });

  // ✅ 等 SW ready（很重要）
  await navigator.serviceWorker.ready;

  return reg;
}

async function getPushEnabledForTrip(tripId){
  if(!("serviceWorker" in navigator)) return false;
  if(!("PushManager" in window)) return false;
  if(Notification.permission !== "granted") return false;

  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return false;

  const sub = await reg.pushManager.getSubscription();
  if(!sub?.endpoint) return false;

  // ✅ 去 DB 查這個 endpoint 目前綁的是哪個 trip
  const { data, error } = await supabase
    .from("push_subscriptions")
    .select("trip_id")
    .eq("endpoint", sub.endpoint)
    .maybeSingle();

  if(error) {
    console.warn("check push_subscriptions failed:", error);
    return false;
  }

  return data?.trip_id === tripId;
}
async function renderPushBell(){
  const btn = $("btnEnablePush");
  if(!btn) return;

  setBellIcon(btn);

  const enabled = await getPushEnabledForTrip(tripId);
  btn.classList.toggle("enabled", enabled);
  btn.title = enabled ? "通知：已開啟（點一下關閉）" : "通知：已關閉（點一下開啟）";
  btn.setAttribute("aria-label", btn.title);
}

async function disablePush(){
  const reg = await ensureServiceWorkerReady();
  const sub = await reg.pushManager.getSubscription();
  if(!sub) return;

  const endpoint = sub.endpoint;

  // 1) 取消訂閱（瀏覽器端）
  await sub.unsubscribe();

  // 2) 從 DB 刪掉
  const del = await supabase
    .from("push_subscriptions")
    .delete()
    .eq("endpoint", endpoint);

  if(del.error){
    console.warn("delete push_subscriptions failed:", del.error);
    // 不中斷：至少本機 unsubscribe 成功了
  }
}

async function enablePush(){
	
	//if(!await requireEdit("開啟通知")) return;
	
  const reg = await ensureServiceWorkerReady();

  const perm = await Notification.requestPermission();
  if(perm !== "granted"){
    alert("未允許通知");
    return;
  }

  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    const keyArr = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: keyArr
    });
  }

  const json = sub.toJSON();
  const endpoint = json.endpoint;
  const p256dh = json.keys?.p256dh || "";
  const auth = json.keys?.auth || "";

  const up = await supabase
    .from("push_subscriptions")
    .upsert([{ endpoint, p256dh, auth, trip_id: tripId }], { onConflict: "endpoint"  });

  if(up.error){
    console.error("push_subscriptions upsert error:", up.error);
    alert("訂閱儲存失敗：" + (up.error.message || JSON.stringify(up.error)));
    return;
  }

  alert("通知已開啟");
  
  await fetch(`${PUSH_WORKER}/api/push/new-subscriber`, {
	  method: "POST",
	  headers: { "content-type":"application/json" },
	  body: JSON.stringify({ tripId })
	});
}

});
