<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="/icons/icon-192.png">

	<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

	<link rel="manifest" href="/manifest.webmanifest">

	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Johnny/Vivian">
	<meta name="theme-color" content="#fbf7f0">
  <title>Johnny &amp; Vivian｜旅遊日記</title>
  <style>
    :root{
      --paper: #fbf7f0;
      --paper2:#f6f0e6;
      --ink:   #2b2b2b;
      --muted: #6b6b6b;

      --lavender: #7c6ee6;
      --lavender2:#a89cf2;
      --snow: #ffffff;
      --glacier:#dcecff;
      --mint: #5bbf9a;
      --amber:#d9a441;
      --berry:#d46a7a;

      --line: #e6e0f2;
      --grid: rgba(124,110,230,.10);
      --shadow: 0 10px 26px rgba(40,40,60,.07);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--paper); /* ✅ 由漸層改純色 */
      background-size: 24px 24px, 24px 24px, auto;
    }
    header{
      padding: 18px 18px 10px 18px;
      display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
    }
    h1{ margin:0; font-size:18px; letter-spacing:.2px; }
    .sub{ color:var(--muted); font-size:14px; margin-top:6px; line-height:1.5; }
    .wrap{ padding: 0 18px 20px 18px; }
    .toolbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin: 10px 0 14px 0;
    }
    .input{
      border:1px solid var(--line);
      background: rgba(255,255,255,.75);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 240px;
      outline:none;
    }
    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.75);
      color: var(--ink);
      padding:9px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:13px;
      box-shadow: 0 2px 10px rgba(40,40,60,.05);
    }
    .btn:hover{ border-color: rgba(124,110,230,.45); background: rgba(168,156,242,.18); }
    .btn.primary{ border-color: rgba(124,110,230,.55); background: rgba(124,110,230,.14); }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card{
      border:1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadow);
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .meta{ color:var(--muted); font-size:12px; line-height:1.5; }
    footer{ padding: 10px 18px 18px 18px; color:var(--muted); font-size:12px; }
    .empty{ border:1px dashed var(--line); background: rgba(255,255,255,.55); padding:14px; border-radius:16px; }
    /* 顯示狀態：旅程標題按鈕 */
		.tripTitleBtn{
		  display:block;
		  font-size: 18px;      /* 原本大概 14 */
		  line-height: 1.25;
		  font-weight: 900;
		}
    
		.tripTitleInput{
		  width:100%;
		  border:1px solid var(--line);
		  background: rgba(255,255,255,.75);
		  border-radius: 12px;
		  padding: 8px 10px;
		  font-size:18px;
		  font-weight:800;
		  outline:none;
		}
		.tripDelIconBtn{
		  width: 26px;
		  height: 26px;
		  padding: 0;
		  border-radius: 10px;

		  border: 1px solid rgba(212,106,122,.22);
		  background: rgba(212,106,122,.10);
		  box-shadow: none;

		  display: inline-flex;
		  align-items: center;
		  justify-content: center;
		  cursor: pointer;
		}

		.tripDelIconBtn svg{
		  width: 16px;
		  height: 16px;
		  stroke: rgba(120,40,55,.70)
		}

		.tripDelIconBtn:hover{
		  background: rgba(212,106,122,.14);
		  border-color: rgba(212,106,122,.30);
		}

		.iconBtn{
		  width: 36px;
		  height: 36px;
		  border-radius: 12px;
		  border: 1px solid var(--line);
		  background: rgba(255,255,255,.78);
		  box-shadow: 0 2px 10px rgba(40,40,60,.05);
		  display:inline-flex;
		  align-items:center;
		  justify-content:center;
		  cursor:pointer;
		}
		.iconBtn:hover{
		  border-color: rgba(124,110,230,.45);
		  background: rgba(168,156,242,.18);
		}
		.iconBtn svg{
		  width: 18px;
		  height: 18px;
		  stroke: rgba(43,43,43,.78);
		}
		.iconBtn:focus{
		  outline: 2px solid rgba(124,110,230,.35);
		  outline-offset: 2px;
		}
		/* 讓 header 滿版（抵消 card padding） */
		.card { position: relative; cursor: pointer;
						transition: transform .08s ease, background-color .12s ease, border-color .12s ease;
		  			-webkit-tap-highlight-color: transparent; }
		  			
		.card:active{
		  transform: translateY(1px);
		  background: rgba(168,156,242,.16);         /* 輕微變色（可調） */
		  border-color: rgba(124,110,230,.45);
		}
.tripCardHeader{
  /* 滿版：把 card 原 padding(14px) 吃掉 */
  margin: -14px -14px 0 -14px;
  height: 140px;                 /* 你覺得太高/太矮可調 */
  border-radius: 16px 16px 0 0;  /* 上方圓角跟 card 一致 */
  border: 1px solid var(--line);
  border-bottom: none;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(124,110,230,.18), rgba(220,236,255,.55));
  background-size: cover;
  background-position: center;
}

/* 封面遮罩（讓 icon/文字更清楚） */
.tripCardHeaderOverlay{
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.18));
}

/* 相機 icon 疊在封面右上角 */
.headerTools{
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
  z-index: 2;
}
/* 底部工具列：左按鈕、右日期 */
.tripFooterRow{
  display:flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}

.tripFooterLeft{
  display:flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.tripFooterRight{
  text-align: right;
  white-space: nowrap; /* 日期資訊靠右且不亂換行；若你想可換行可刪掉 */
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.tripMetaLine{
  display: grid;
  grid-template-columns: 44px auto; /* ✅ 讓「建立/更新」對齊的關鍵：可微調 40~52 */
  column-gap: 6px;
  justify-content: end;            /* ✅ 整行靠右 */
  align-items: center;
}

.tripMetaLabel{
  text-align: right;              /* ✅ label 靠右，冒號會垂直對齊 */
  font-weight: 900;
  color: var(--muted);
}

.tripMetaValue{
  font-variant-numeric: tabular-nums; /* 可留可不留，數字更整齊 */
}
/* ---- Crop Modal ---- */
.modalMask{
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.35);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 16px;
}
.modal{
  width: min(720px, 100%);
  background: rgba(255,255,255,.92);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 18px 60px rgba(0,0,0,.18);
  overflow: hidden;
}
.modalHead{
  padding: 12px 14px;
  display:flex;
  justify-content: space-between;
  align-items:center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.modalTitle{
  font-weight: 900;
}
.modalBody{
  padding: 14px;
}
.cropStage{
  width: 100%;
  aspect-ratio: 3 / 1; /* 這就是「長條卡」比例，可改 16/9 或 2.5/1 */
  background: rgba(124,110,230,.08);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  touch-action: none; /* 允許拖曳時不被瀏覽器捲動打斷 */
}
.cropStage img{
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.modalControls{
  display:flex;
  gap: 10px;
  align-items: center;
  margin-top: 12px;
  flex-wrap: wrap;
}
.range{
  width: min(320px, 100%);
}
.modalFoot{
  padding: 12px 14px;
  display:flex;
  justify-content: flex-end;
  gap: 10px;
  border-top: 1px solid var(--line);
}

/* ✅ 右上角 icon 按鈕 */
.topIconBtn{
  position: absolute;
  top: 14px;
  right: 18px;

  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 14px;

  border: 1px solid var(--line);
  background: rgba(255,255,255,.78);
  box-shadow: 0 2px 10px rgba(40,40,60,.05);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.topIconBtn:hover{
  border-color: rgba(124,110,230,.45);
  background: rgba(168,156,242,.18);
}

.topIconImg{
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;     /* 想完整顯示可改成 contain */
  border-radius: 14px;
}
/* ===== Trip card menu + push indicator ===== */
.tripCardTools{
  position: relative;
  display:flex;
  align-items:center;
  gap: 10px;
}

/* 黃色小鈴鐺：只顯示狀態，不可點 */
.tripBellIndicator{
  width: 26px;
  height: 26px;
  color: #f2b705;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.tripBellIndicator svg{ width: 22px; height: 22px; fill: currentColor; }

/* 三點按鈕 */
.tripMoreBtn{
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.78);
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(40,40,60,.05);

  display:inline-flex;
  align-items:center;
  justify-content:center;

  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  color: rgba(0,0,0,.55);
}
.tripMoreBtn:hover{
  border-color: rgba(124,110,230,.45);
  background: rgba(168,156,242,.18);
}

/* menu */
.tripMenu{
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  min-width: 220px;
  border: 1px solid rgba(0,0,0,.10);
  background: rgba(255,255,255,.96);
  border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0,0,0,.18);
  padding: 6px;
  z-index: 999;
}

.tripMenuItem{
  width: 100%;
  border: 0;
  background: transparent;
  padding: 12px 12px;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-weight: 900;
  display:flex;
  align-items:center;
  gap: 10px;
}
.tripMenuItem:hover{ background: rgba(0,0,0,.06); }
.tripMenuItem.danger{ color: #c0262d; }
.tripMenuItem.danger:hover{ background: rgba(192,38,45,.10); }
/* Push menu item colors */
.tripMenuItem.pushOn{
  color: #111;                 /* 深一點的黃/棕，文字清楚 */
}
.tripMenuItem.pushOn:hover{
  background: rgba(242,183,5,.16); /* 黃色 hover */
}

.tripMenuItem.pushOff{
  color: rgba(0,0,0,.55);         /* 灰色 */
}
.tripMenuItem.pushOff:hover{
  background: rgba(0,0,0,.06);    /* 灰色 hover */
}

[hidden]{
  display: none !important;
}
/* ===== Edit Gate (password / read-only) ===== */
.gateMask{
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.45);
  display: none;
  align-items:center;
  justify-content:center;
  z-index: 2000;
  padding: 16px;
}
.gateModal{
  width: min(420px, 92vw);
  background: rgba(255,255,255,.96);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 60px rgba(0,0,0,.22);
  overflow: hidden;
}
.gateHead{
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-weight: 900;
}
.gateBody{
  padding: 14px;
}
.gateBody .hint{
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 10px;
}
.gateInput{
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 16px;
  outline: none;
  background: rgba(255,255,255,.85);
}
.gateErr{
  color: #c0262d;
  font-weight: 900;
  font-size: 13px;
  margin-top: 8px;
  min-height: 18px;
}
.gateFoot{
  padding: 12px 14px;
  border-top: 1px solid var(--line);
  display:flex;
  gap: 10px;
  justify-content: flex-end;
}
  </style>
</head>

<header>

<div class="wrap">
 <div class="toolbar">

</footer>

<!-- Crop Modal -->
<div class="modalMask" id="cropMask" aria-hidden="true">

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtza3hqYnplb2tyYWV0ZXJxenpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDgyMDgsImV4cCI6MjA5NzgyNDIwOH0.bUmpIha1cpKIAGjD4Dvrmf0c44zYRmguigcf9N73BDk"
  );

  const INDEX_KEY = "tripIndex_v1";
  const NOTEBOOK_FILE = "notebook.html";
  const BUCKET = "TripCard-photo";

  const $ = (id) => document.getElementById(id);
  
  // ===== Push on Index =====
	const VAPID_PUBLIC_KEY = "BN-v_VYdX62iacpTnq5TskkoJqLb08ILl3U5jMIJaM4QDo0SrVdNm-YIKHpYuptaVxlSbCW3otZCQQZmwb5uM1Y";

	const pushState = {
	  endpoint: null,
	  tripId: null, // 這台裝置目前綁定推播的 trip_id（沒有就 null）
	};

	function urlBase64ToUint8Array(base64String) {
	  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
	  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
	  const raw = atob(base64);
	  const arr = new Uint8Array(raw.length);
	  for (let i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
	  return arr;
	}

	async function ensureServiceWorkerReady(){
	  if(!("serviceWorker" in navigator)) return null;
	  const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
	  await navigator.serviceWorker.ready;
	  return reg;
	}

	async function getCurrentSubscription(){
	  if(!("serviceWorker" in navigator)) return null;
	  const reg = await navigator.serviceWorker.getRegistration("/") || await navigator.serviceWorker.getRegistration();
	  if(!reg) return null;
	  return await reg.pushManager.getSubscription();
	}

	async function loadPushStateFromDb(){
	  pushState.endpoint = null;
	  pushState.tripId = null;

	  const sub = await getCurrentSubscription();
	  if(!sub?.endpoint) return;

	  pushState.endpoint = sub.endpoint;

	  const { data, error } = await supabase
	    .from("push_subscriptions")
	    .select("trip_id")
	    .eq("endpoint", sub.endpoint)
	    .limit(1)
	    .maybeSingle();

	  if(error){
	    console.warn("loadPushStateFromDb error:", error);
	    return;
	  }

	  pushState.tripId = data?.trip_id || null;
	}
	
	const PUSH_WORKER = "https://trip-plan-push.johnnydx72870820.workers.dev";

	async function enablePushForTrip(tripId){
	  const reg = await ensureServiceWorkerReady();
	  if(!reg) throw new Error("No serviceWorker");

	  const perm = await Notification.requestPermission();
	  if(perm !== "granted"){
	    alert("未允許通知");
	    return;
	  }

	  let sub = await reg.pushManager.getSubscription();
	  if(!sub){
	    sub = await reg.pushManager.subscribe({
	      userVisibleOnly: true,
	      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
	    });
	  }

	  const json = sub.toJSON();
	  const endpoint = json.endpoint;
	  const p256dh = json.keys?.p256dh || "";
	  const auth = json.keys?.auth || "";

	  const { error } = await supabase
	    .from("push_subscriptions")
	    .upsert([{ endpoint, p256dh, auth, trip_id: tripId }], { onConflict: "endpoint" });

	  if(error){
	    alert("訂閱儲存失敗：" + (error.message || JSON.stringify(error)));
	    return;
	  }
	  
	  // ✅ 新裝置加入：通知所有訂閱者（先不排除自己）
		await fetch(`${PUSH_WORKER}/api/push/new-subscriber`, {
		  method: "POST",
		  headers: { "content-type":"application/json" },
		  body: JSON.stringify({tripId,})
		});
	}
	
	async function canEditFromWorker(){
	  const deviceId = getDeviceId();
	  const res = await fetch(`${PUSH_WORKER}/api/edit/can-edit`, {
	    method: "POST",
	    headers: { "content-type":"application/json" },
	    body: JSON.stringify({ deviceId })
	  });
	  const data = await res.json().catch(()=>({}));
	  return !!data?.canEdit;
	}

	async function unlockByWorker(password){
	  const deviceId = getDeviceId();
	  const res = await fetch(`${PUSH_WORKER}/api/edit/unlock`, {
	    method: "POST",
	    headers: { "content-type":"application/json" },
	    body: JSON.stringify({ deviceId, password })
	  });
	  const data = await res.json().catch(()=>({}));
	  return !!data?.canEdit;
	}

	async function disablePush(){
	  const reg = await ensureServiceWorkerReady();
	  if(!reg) return;

	  const sub = await reg.pushManager.getSubscription();
	  if(!sub) return;

	  const endpoint = sub.endpoint;
	  await sub.unsubscribe();

	  const { error } = await supabase
	    .from("push_subscriptions")
	    .delete()
	    .eq("endpoint", endpoint);

	  if(error) console.warn("delete push_subscriptions failed:", error);
	}

	function applyTripCardPushUI(cardEl, tripId){
	  const indicator = cardEl.querySelector("[data-bell-indicator]");
	  if(indicator){

	/** 遞迴刪除 prefix 底下所有檔案（含子資料夾） */
	/** 遞迴刪除 prefix 底下所有檔案（含子資料夾），不漏刪版 */
async function removeFolderDeep(prefix){
		  const queue = [prefix];

		  while(queue.length){
		    const p = queue.shift();

		    // ✅ 不用 offset 分頁（避免刪除後資料往前補造成漏刪）
		    while(true){
		      const { data, error } = await supabase
		        .storage
		        .from(BUCKET)
		        .list(p, { limit: 1000, offset: 0 });

		      if(error) throw error;
		      if(!data || data.length === 0) break;

		      const files = [];

		      for(const item of data){
		        if(!item?.name) continue;

		        // folder: id=null / metadata=null（Supabase 常見型態）
		        const isFolder = !item.id && !item.metadata;

		        if(isFolder){
		          queue.push(`${p}/${item.name}`);
		        }else{
		          files.push(`${p}/${item.name}`);
		        }
		      }

		      // 先刪檔案
		      if(files.length){
		        const { error: rmErr } = await supabase.storage.from(BUCKET).remove(files);
		        if(rmErr) throw rmErr;
		      }else{
		        // 這層只有資料夾（都已丟 queue），就可以跳出這層
		        break;
		      }
		    }
		  }
		}

  });
}

// ===== Cropper (Y-only, no zoom) =====
const cropMask  = document.getElementById("cropMask");
const cropStage = document.getElementById("cropStage");
const cropImg   = document.getElementById("cropImg");

const cropState = {
  file: null,
  objectUrl: null,
  scaleBase: 1,   // 自動「剛好填滿裁切框」的比例（固定）
  offsetY: 0,     // 只允許上下
  dragging: false,
  dragStartY: 0,
  dragBaseY: 0,
  resolver: null,
  rejecter: null
};

function openCropper(tripId, file){
  return new Promise((resolve, reject) => {
    cropState.file = file;
    cropState.resolver = resolve;
    cropState.rejecter = reject;

    // 先顯示 modal，否則 cropStage 尺寸會是 0
    cropMask.style.display = "flex";
    cropMask.setAttribute("aria-hidden", "false");

    // 建立 object URL
    if(cropState.objectUrl) URL.revokeObjectURL(cropState.objectUrl);
    cropState.objectUrl = URL.createObjectURL(file);

    cropImg.onload = () => {
      // 等下一幀再量尺寸（確保 modal 真的布局完成）
      requestAnimationFrame(() => {
        const stageRect = cropStage.getBoundingClientRect();

        cropState.scaleBase = Math.max(
          stageRect.width / cropImg.naturalWidth,
          stageRect.height / cropImg.naturalHeight
        );

        cropState.offsetY = 0;
        applyCropTransform();
      });
    };

    cropImg.onerror = () => {
      reject(new Error("圖片載入失敗"));
      closeCropper();
    };

    cropImg.src = cropState.objectUrl;
  });
}

function closeCropper(){
  cropMask.style.display = "none";
  cropMask.setAttribute("aria-hidden", "true");
  if(cropState.objectUrl){
    URL.revokeObjectURL(cropState.objectUrl);
    cropState.objectUrl = null;
  }
  cropImg.src = "";
}

function clampOffsetY(){
  const stageH = cropStage.getBoundingClientRect().height;
  const drawH = cropImg.naturalHeight * cropState.scaleBase;
  const max = Math.max(0, (drawH - stageH) / 2);
  cropState.offsetY = Math.max(-max, Math.min(max, cropState.offsetY));
}

function applyCropTransform(){
  clampOffsetY();
  cropImg.style.transform =
    `translate(-50%, -50%) translate(0px, ${cropState.offsetY}px) scale(${cropState.scaleBase})`;
}

// 只上下拖曳
cropStage.addEventListener("pointerdown", (e) => {
  cropState.dragging = true;
  cropStage.setPointerCapture(e.pointerId);
  cropState.dragStartY = e.clientY;
  cropState.dragBaseY = cropState.offsetY;
});

cropStage.addEventListener("pointermove", (e) => {
  if(!cropState.dragging) return;
  const dy = e.clientY - cropState.dragStartY;
  cropState.offsetY = cropState.dragBaseY + dy;
  applyCropTransform();
});

cropStage.addEventListener("pointerup", () => { cropState.dragging = false; });

document.getElementById("cropClose").addEventListener("click", () => {
  cropState.rejecter?.(new Error("cancel"));
  closeCropper();
});
document.getElementById("cropCancel").addEventListener("click", () => {
  cropState.rejecter?.(new Error("cancel"));
  closeCropper();
});
document.getElementById("cropReset").addEventListener("click", () => {
  cropState.offsetY = 0;
  applyCropTransform();
});

async function cropToJpegBlob(){
  const stageRect = cropStage.getBoundingClientRect();
  const outW = Math.round(stageRect.width * 2);
  const outH = Math.round(stageRect.height * 2);

  const canvas = document.createElement("canvas");
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext("2d");

  const bitmap = await createImageBitmap(cropState.file);

  const stageW = stageRect.width;
  const stageH = stageRect.height;

  const scale = cropState.scaleBase;
  const drawW = bitmap.width * scale;
  const drawH = bitmap.height * scale;

  const centerX = stageW / 2; // X 固定置中
  const centerY = stageH / 2 + cropState.offsetY;

  const imgX = centerX - drawW / 2;
  const imgY = centerY - drawH / 2;

  const kx = outW / stageW;
  const ky = outH / stageH;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, outW, outH);
  ctx.drawImage(bitmap, imgX * kx, imgY * ky, drawW * kx, drawH * ky);

  return await new Promise((resolve) => {
    canvas.toBlob((b) => resolve(b), "image/jpeg", 0.88);
  });
}

document.getElementById("cropOk").addEventListener("click", async () => {
  try{
    const blob = await cropToJpegBlob();
    cropState.resolver?.(blob);
  }catch(err){
    cropState.rejecter?.(err);
  }finally{
    closeCropper();
  }
});

	  if(!btn) return;

	  const card = btn.closest(".card[data-trip-id]");
	  const menu = card?.querySelector("[data-trip-menu]");
	  if(!menu) return;

	  if(openedMenu && openedMenu !== menu) closeMenu();

	  menu.hidden = !menu.hidden;
	  openedMenu = menu.hidden ? null : menu;

	  e.preventDefault();
	  e.stopPropagation();
	}, true);

	// menu：開/關通知
	document.addEventListener("click", async (e) => {
	  const btn = e.target.closest("[data-trip-push-toggle]");
	  if(!btn) return;
	  
	  //if(!requireEdit("變更通知")) return;

	  const card = btn.closest(".card[data-trip-id]");
	  const tripId = card?.dataset.tripId;
	  if(!tripId) return;

	  closeMenu();
	  e.preventDefault();
	  e.stopPropagation();

	  // 若目前已綁在別的 trip，提醒使用者（因為你 DB 設計一次只能綁一個）
	  if(pushState.tripId && pushState.tripId !== tripId){
	    const ok = confirm("此裝置目前已在另一個行程開啟通知。\n要改為此行程嗎？");
	    if(!ok) return;
	  }

	  if(pushState.tripId === tripId){
	    await disablePush();
	  }else{
	    await enablePushForTrip(tripId);
	  }

	  await loadPushStateFromDb();
	  await render();
	}, true);
	  
  await ensureServiceWorkerReady();
	await loadPushStateFromDb();

	CAN_EDIT = await resolveEditPermission();

	await render();

	// 如果是唯讀，把 UI 清掉（因為 render 已把卡片產生）
	if(!CAN_EDIT){
	  applyReadOnlyUI();
	}
  document.getElementById("btnReload")?.addEventListener("click", () => {
  	location.href = location.pathname + "?t=" + Date.now();
	});
</script>
</body>
</html>
